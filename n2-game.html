<title>N2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Lalezar&family=Vazirmatn:wght@400;700;900&display=swap">
<style>
/* Layout: full-bleed landscape game canvas; menus float above it as neon arcade panels */
:root{
  --ink:#07051a;
  --night:#140d33;
  --panel:rgba(16,10,44,.82);
  --cyan:#29f3ff;
  --pink:#ff3fd8;
  --gold:#ffe14a;
  --amber:#ff8a1f;
  --txt:#f2eeff;
  --mute:#a99ed6;
  --disp:'Lalezar','Vazirmatn',Tahoma,sans-serif;
  --body:'Vazirmatn',Tahoma,sans-serif;
  --latin:'Bungee','Lalezar',Impact,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ink);color:var(--txt);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{font-family:var(--body);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--ink)}
#game{display:block;touch-action:none;background:var(--ink)}
#ui{position:fixed;inset:0;pointer-events:none;direction:rtl}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,2.4vh,18px);
  padding-block:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  pointer-events:auto;text-align:center;animation:fadeIn .35s ease both}
.screen.dim{background:radial-gradient(ellipse at center,rgba(20,8,50,.72),rgba(5,3,18,.94))}
@keyframes fadeIn{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}

.logo{font-family:var(--latin);font-size:clamp(64px,24vh,170px);line-height:.9;letter-spacing:.04em;direction:ltr;margin:0}
.logo .n{color:#e9fdff;text-shadow:0 0 6px var(--cyan),0 0 18px var(--cyan),0 0 42px var(--cyan),0 0 80px #1aa9ff;animation:flick 5s infinite}
.logo .t{color:#fff0fd;text-shadow:0 0 6px var(--pink),0 0 18px var(--pink),0 0 42px var(--pink),0 0 80px #b01fff}
@keyframes flick{0%,18%,22%,62%,64%,100%{opacity:1}20%,63%{opacity:.35}}
.tag{font-family:var(--disp);font-size:clamp(18px,5.4vh,32px);color:var(--gold);text-shadow:0 0 10px rgba(255,225,74,.7);margin:0}
.h2{font-family:var(--disp);font-size:clamp(26px,8vh,46px);margin:0;color:#fff;text-shadow:0 0 10px var(--pink),0 0 26px var(--pink)}
.h2.cy{text-shadow:0 0 10px var(--cyan),0 0 26px var(--cyan)}
.h2.gd{text-shadow:0 0 10px var(--gold),0 0 26px var(--amber)}
.sub{font-size:clamp(13px,3.6vh,17px);color:var(--mute);margin:0;max-width:60ch}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center}
.col{display:flex;flex-direction:column;gap:10px;align-items:stretch}

.btn{font-family:var(--disp);font-size:clamp(17px,5vh,24px);color:var(--txt);background:rgba(10,6,30,.75);
  border:2px solid var(--cyan);padding:.32em 1.3em .42em;min-width:9.5em;cursor:pointer;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
  box-shadow:inset 0 0 14px rgba(41,243,255,.35);text-shadow:0 0 8px rgba(41,243,255,.8);transition:transform .08s,background .15s}
.btn:active{transform:scale(.95)}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.btn.pk{border-color:var(--pink);box-shadow:inset 0 0 16px rgba(255,63,216,.45);text-shadow:0 0 8px rgba(255,63,216,.9);background:rgba(60,8,58,.6)}
.btn.gd{border-color:var(--gold);box-shadow:inset 0 0 16px rgba(255,225,74,.35);text-shadow:0 0 8px rgba(255,225,74,.9)}
.btn.sm{min-width:0;font-size:clamp(15px,4.2vh,19px);padding:.25em .9em .32em}

.panel{background:var(--panel);border:1.5px solid rgba(41,243,255,.45);box-shadow:0 0 30px rgba(41,243,255,.15),inset 0 0 24px rgba(255,63,216,.08);
  padding:clamp(10px,3vh,20px) clamp(14px,3vw,26px);border-radius:4px;min-width:0;max-width:100%}
.cust{display:flex;gap:clamp(12px,3vw,32px);align-items:center;justify-content:center;flex-wrap:wrap;max-height:100%}
#prev{width:clamp(150px,44vh,240px);height:clamp(170px,52vh,280px);background:radial-gradient(ellipse at 50% 80%,rgba(255,63,216,.25),transparent 60%),radial-gradient(ellipse at 50% 30%,rgba(41,243,255,.18),transparent 70%);border-bottom:2px solid var(--pink);box-shadow:0 10px 30px -14px var(--pink)}
.opt{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.opt b{font-family:var(--disp);font-weight:400;font-size:clamp(16px,4.4vh,21px);color:var(--gold)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-family:var(--body);font-weight:700;font-size:clamp(13px,3.6vh,16px);color:var(--txt);background:rgba(255,255,255,.05);border:1.5px solid rgba(169,158,214,.5);padding:.3em .9em;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--cyan);background:rgba(41,243,255,.16);box-shadow:0 0 12px rgba(41,243,255,.5)}
.sw{width:clamp(26px,8vh,34px);height:clamp(26px,8vh,34px);border-radius:50%;border:2px solid rgba(255,255,255,.25);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 3px var(--cyan),0 0 14px var(--cyan)}
.stats{font-family:var(--latin);direction:ltr;font-size:clamp(22px,7vh,40px);color:#fff;text-shadow:0 0 12px var(--cyan)}
.small{font-size:clamp(12px,3.2vh,14px);color:var(--mute)}
.tgl{display:flex;justify-content:space-between;gap:24px;align-items:center;font-weight:700;font-size:clamp(14px,4vh,18px)}
#rot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--ink);z-index:9;text-align:center;font-family:var(--disp);font-size:24px;color:var(--txt);direction:rtl}
#rot .ph{width:56px;height:96px;border:4px solid var(--cyan);border-radius:12px;box-shadow:0 0 18px var(--cyan);animation:rot 2s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--ink);font-family:var(--latin);font-size:42px;color:#fff;text-shadow:0 0 14px var(--cyan),0 0 30px var(--pink);z-index:10;direction:ltr}
@media (prefers-reduced-motion:reduce){.logo .n{animation:none}.screen{animation:none}#rot .ph{animation:none}}
</style>

<div id="app"><canvas id="game"></canvas></div>
<div id="ui">
  <section class="screen" id="s-title" hidden>
    <h1 class="logo"><span class="n">N</span><span class="t">2</span></h1>
    <p class="tag">نیما در شهر نئون</p>
    <div class="row">
      <button class="btn pk" id="b-start">شروع بازی</button>
      <button class="btn" id="b-cust">شخصیت</button>
      <button class="btn" id="b-set">تنظیمات</button>
    </div>
    <p class="small" id="best"></p>
  </section>

  <section class="screen dim" id="s-diff" hidden>
    <h2 class="h2 cy">سطح سختی</h2>
    <div class="row">
      <div class="panel col">
        <button class="btn" id="b-normal">معمولی</button>
        <p class="small">۳ جان، دشمن‌های آرام‌تر</p>
      </div>
      <div class="panel col">
        <button class="btn pk" id="b-hard">سخت</button>
        <p class="small">۲ جان، دشمن بیشتر و ضربه‌های سنگین‌تر</p>
      </div>
    </div>
    <button class="btn sm" data-back>بازگشت</button>
  </section>

  <section class="screen dim" id="s-cust" hidden>
    <div class="cust">
      <canvas id="prev" width="480" height="560"></canvas>
      <div class="panel col" style="gap:14px">
        <div class="opt"><b>اسکین</b>
          <div class="seg" id="o-skin">
            <button class="chip" data-v="normal">معمولی</button>
            <button class="chip" data-v="halloween">ماسک هالووین</button>
          </div></div>
        <div class="opt"><b>ریش</b>
          <div class="seg" id="o-beard">
            <button class="chip" data-v="short">کوتاه</button>
            <button class="chip" data-v="long">بلند</button>
          </div></div>
        <div class="opt"><b>رنگ کلاه</b>
          <div class="seg" id="o-cap"></div></div>
        <button class="btn pk sm" data-back>ذخیره و بازگشت</button>
      </div>
    </div>
  </section>

  <section class="screen dim" id="s-set" hidden>
    <h2 class="h2 cy">تنظیمات</h2>
    <div class="panel col" style="min-width:min(320px,100%)">
      <label class="tgl">موسیقی <button class="chip" id="t-mus"></button></label>
      <label class="tgl">افکت صوتی <button class="chip" id="t-sfx"></button></label>
      <label class="tgl">لرزش گوشی <button class="chip" id="t-vib"></button></label>
      <label class="tgl">کیفیت گرافیک <button class="chip" id="t-q"></button></label>
    </div>
    <button class="btn sm" data-back>بازگشت</button>
  </section>

  <section class="screen dim" id="s-pause" hidden>
    <h2 class="h2 cy">مکث</h2>
    <div class="col">
      <button class="btn pk" id="b-resume">ادامه</button>
      <button class="btn" id="b-restart">شروع دوباره مرحله</button>
      <button class="btn" id="b-psnd">صدا: روشن</button>
      <button class="btn" id="b-quit">منوی اصلی</button>
    </div>
  </section>

  <section class="screen dim" id="s-over" hidden>
    <h2 class="h2">نیما شکست خورد!</h2>
    <p class="stats" id="over-score">0</p>
    <div class="row">
      <button class="btn pk" id="b-retry">دوباره از همین مرحله</button>
      <button class="btn" id="b-omenu">منوی اصلی</button>
    </div>
  </section>

  <section class="screen dim" id="s-clear" hidden>
    <h2 class="h2 cy" id="clear-t">مرحله تمام شد!</h2>
    <p class="stats" id="clear-score">0</p>
    <p class="sub" id="clear-sub"></p>
    <button class="btn pk" id="b-next">مرحله بعد</button>
  </section>

  <section class="screen dim" id="s-win" hidden>
    <h1 class="logo" style="font-size:clamp(48px,16vh,110px)"><span class="n">N</span><span class="t">2</span></h1>
    <h2 class="h2 gd">نیما قهرمان شهر نئون شد!</h2>
    <p class="stats" id="win-score">0</p>
    <p class="small" id="win-best"></p>
    <div class="row">
      <button class="btn pk" id="b-again">بازی دوباره</button>
      <button class="btn" id="b-wmenu">منوی اصلی</button>
    </div>
  </section>
</div>
<div id="rot" hidden><div class="ph"></div>گوشی را افقی کن</div>
<div id="loading">N2</div>
<script>
'use strict';
/* ===================== N2 — core ===================== */
const TAU = Math.PI * 2;
const VH = 540;
let VW = 960, SC = 1, DPR = 1;
const GY0 = 378, GY1 = 512;           // walkable depth band (feet y)
const GRAV = 1750;

const cv = document.getElementById('game');
const cx = cv.getContext('2d');
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeOut = t => 1 - (1 - t) * (1 - t);
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const FA = '۰۱۲۳۴۵۶۷۸۹';
const fa = n => String(n).replace(/\d/g, d => FA[d]);
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function shade(hex, amt) {
  let n = parseInt(hex.slice(1), 16), r = n >> 16, g = n >> 8 & 255, b = n & 255;
  if (amt >= 0) { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
  else { r *= 1 + amt; g *= 1 + amt; b *= 1 + amt; }
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; }

/* ---------- storage ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem('n2.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('n2.' + k, JSON.stringify(v)); } catch (e) { } }
};
const LOOK = Object.assign({ skin: 'normal', beard: 'short', cap: '#9aa0ab' }, store.get('look', {}));
const SET = Object.assign({ mus: true, sfx: true, vib: true, q: 'high' }, store.get('set', {}));

/* ---------- drawing helpers ---------- */
function rr(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2); c.beginPath(); c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function ell(c, x, y, rx, ry, rot) { c.beginPath(); c.ellipse(x, y, Math.max(.1, rx), Math.max(.1, ry), rot || 0, 0, TAU); }
function circ(c, x, y, r) { c.beginPath(); c.arc(x, y, Math.max(.1, r), 0, TAU); }
/* cheap neon: layered strokes, no shadowBlur */
function neon(c, col, w, core) {
  const a = c.globalAlpha;
  c.strokeStyle = col;
  c.globalAlpha = a * .18; c.lineWidth = w * 4; c.stroke();
  c.globalAlpha = a * .4; c.lineWidth = w * 2.1; c.stroke();
  c.globalAlpha = a; c.lineWidth = w; c.stroke();
  if (core !== false) { c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = Math.max(.8, w * .38); c.stroke(); }
  c.globalAlpha = a;
}
function limb(c, x, y, a, len, w, col, endR, endCol, out) {
  c.save(); c.translate(x, y); c.rotate(a);
  c.fillStyle = col; rr(c, -w / 2, -w / 2, w, len + w / 2, w / 2); c.fill();
  if (out) { c.strokeStyle = out; c.lineWidth = 2.4; c.stroke(); }
  if (endR) { c.fillStyle = endCol; circ(c, 0, len, endR); c.fill(); if (out) c.stroke(); }
  c.restore();
}
function glowDot(c, x, y, r, col, a) {
  const g = c.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, rgba(col, a == null ? .9 : a)); g.addColorStop(1, rgba(col, 0));
  c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2);
}
function text(c, s, x, y, o) {
  o = o || {};
  c.font = o.font || '20px Lalezar, Vazirmatn, Tahoma, sans-serif';
  c.textAlign = o.align || 'center'; c.textBaseline = o.base || 'middle';
  if (o.glow) {
    c.save(); c.shadowColor = o.glow; c.shadowBlur = o.blur || 14;
    c.fillStyle = o.fill || '#fff'; c.fillText(s, x, y); c.restore();
  }
  if (o.stroke) { c.lineJoin = 'round'; c.strokeStyle = o.stroke; c.lineWidth = o.sw || 4; c.strokeText(s, x, y); }
  c.fillStyle = o.fill || '#fff'; c.fillText(s, x, y);
}

/* ---------- audio ---------- */
const AU = { ctx: null };
function auInit() {
  try {
    if (!AU.ctx) {
      const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
      const a = new C(); AU.ctx = a;
      const comp = a.createDynamicsCompressor(); comp.threshold.value = -12; comp.ratio.value = 4; comp.connect(a.destination);
      AU.master = a.createGain(); AU.master.gain.value = .9; AU.master.connect(comp);
      AU.sfx = a.createGain(); AU.sfx.connect(AU.master);
      AU.mus = a.createGain(); AU.mus.connect(AU.master);
      const n = a.createBuffer(1, a.sampleRate, a.sampleRate), d = n.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      AU.nb = n;
      const dl = a.createDelay(1); dl.delayTime.value = .3;
      const fb = a.createGain(); fb.gain.value = .3;
      const lf = a.createBiquadFilter(); lf.type = 'lowpass'; lf.frequency.value = 2400;
      AU.echo = a.createGain(); AU.echo.connect(dl); dl.connect(lf); lf.connect(fb); fb.connect(dl); lf.connect(AU.mus);
      auVol();
      if (MU.pending) { const p = MU.pending; MU.pending = null; musPlay(p); }
    }
    if (AU.ctx.state === 'suspended') AU.ctx.resume();
  } catch (e) { }
}
function auVol() { if (!AU.ctx) return; AU.sfx.gain.value = SET.sfx ? .8 : 0; AU.mus.gain.value = SET.mus ? .3 : 0; }
function tn(o) {
  const a = AU.ctx; if (!a || !SET.sfx && !o.dest) return;
  const t = a.currentTime + (o.d || 0), L = o.l || .1;
  const os = a.createOscillator(); os.type = o.w || 'square';
  os.frequency.setValueAtTime(o.f, t);
  if (o.f2) os.frequency.exponentialRampToValueAtTime(Math.max(20, o.f2), t + L);
  const g = a.createGain(); const v = o.v == null ? .3 : o.v;
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + (o.at || .004));
  g.gain.exponentialRampToValueAtTime(.0001, t + L);
  let node = os;
  if (o.lp) { const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; f.Q.value = o.q || 1; os.connect(f); node = f; }
  node.connect(g); g.connect(o.dest || AU.sfx); if (o.echo) g.connect(AU.echo);
  os.start(t); os.stop(t + L + .05);
}
function nz(o) {
  const a = AU.ctx; if (!a || !SET.sfx && !o.dest) return;
  const t = a.currentTime + (o.d || 0), L = o.l || .1;
  const s = a.createBufferSource(); s.buffer = AU.nb; s.loop = true;
  const f = a.createBiquadFilter(); f.type = o.ft || 'lowpass';
  f.frequency.setValueAtTime(o.f || 2000, t); if (o.f2) f.frequency.exponentialRampToValueAtTime(o.f2, t + L); f.Q.value = o.q || .8;
  const g = a.createGain(); g.gain.setValueAtTime(o.v == null ? .3 : o.v, t); g.gain.exponentialRampToValueAtTime(.0001, t + L);
  s.connect(f); f.connect(g); g.connect(o.dest || AU.sfx);
  s.start(t, Math.random() * .5); s.stop(t + L + .05);
}
const SFX = {
  ui() { tn({ w: 'triangle', f: 880, l: .06, v: .22 }); tn({ w: 'triangle', f: 1320, l: .08, v: .2, d: .05 }); },
  whoosh() { nz({ ft: 'bandpass', f: 500, f2: 2600, q: 1.6, l: .13, v: .22 }); },
  punch() { nz({ f: 2200, f2: 260, l: .08, v: .5 }); tn({ w: 'sine', f: 170, f2: 48, l: .14, v: .7 }); },
  bat() { tn({ w: 'sine', f: 130, f2: 40, l: .2, v: .8 }); nz({ f: 3000, f2: 400, l: .12, v: .45 }); tn({ w: 'triangle', f: 760, f2: 600, l: .07, v: .14 }); },
  clang() { [523, 1307, 1990, 2711].forEach((f, i) => tn({ w: 'square', f, l: .4 - i * .06, v: .07, lp: 6000 })); nz({ f: 5000, f2: 900, l: .07, v: .35 }); tn({ w: 'sine', f: 150, f2: 50, l: .14, v: .55 }); },
  pew() { tn({ w: 'square', f: 1500, f2: 260, l: .13, v: .2 }); tn({ w: 'sawtooth', f: 760, f2: 120, l: .1, v: .12 }); },
  zap() { tn({ w: 'sawtooth', f: 1100, f2: 60, l: .38, v: .2 }); nz({ ft: 'highpass', f: 3000, l: .3, v: .12 }); },
  ko() { tn({ w: 'square', f: 220, f2: 55, l: .3, v: .28 }); nz({ f: 1500, f2: 100, l: .3, v: .35 }); },
  pickup() { [660, 880, 1320].forEach((f, i) => tn({ w: 'triangle', f, l: .09, v: .24, d: i * .055 })); },

  const on = (id, fn) => $(id).addEventListener('click', () => { auInit(); SFX.ui(); fn(); });
  on('b-start', () => showScreen('s-diff'));
  on('b-cust', () => { syncCust(); showScreen('s-cust'); });
  on('b-set', () => { syncSet(); showScreen('s-set'); });
  on('b-normal', () => newGame('normal'));
  on('b-hard', () => newGame('hard'));
  document.querySelectorAll('[data-back]').forEach(b => b.addEventListener('click', () => { SFX.ui(); showScreen('s-title'); }));
  ['mus', 'sfx', 'vib', 'q'].forEach(k => $('t-' + k).addEventListener('click', ev => { ev.preventDefault(); toggleSet(k); }));
  on('b-resume', resumeGame);
  on('b-restart', () => { G.lives = G.D.lives; G.score = G.stageScore; hideScreens(); startStage(G.stage); });
  on('b-psnd', () => { const v = !(SET.mus || SET.sfx); SET.mus = SET.sfx = v; store.set('set', SET); auVol(); $('b-psnd').textContent = 'صدا: ' + (v ? 'روشن' : 'خاموش'); });
  on('b-quit', toMenu);
  on('b-retry', () => { G.lives = G.D.lives; G.score = G.stageScore; hideScreens(); startStage(G.stage); });
  on('b-omenu', toMenu);
  on('b-next', () => { hideScreens(); startStage(G.stage + 1, true); });
  on('b-again', () => showScreen('s-diff'));
  on('b-wmenu', toMenu);
  document.addEventListener('pointerdown', () => auInit(), { passive: true });
  addEventListener('resize', resize);
  addEventListener('orientationchange', () => setTimeout(resize, 200));
  document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
  buildCust();
}
// hooks for the Android wrapper
window.n2Pause = () => pauseGame();
window.n2Back = () => {
  if (G.state === 'play') { pauseGame(); return true; }
  if (G.state === 'paused') { resumeGame(); return true; }
  const open = SCREENS.find(s => !$(s).hidden);
  if (open && open !== 's-title') { toMenu(); return true; }
  return false;
};

/* loop */
let last = 0;
function frame(ts) {
  const dt = Math.min(.05, (ts - last) / 1000 || 0); last = ts;
  if (G.state !== 'paused') update(dt);
  INP.atkE = INP.jumpE = INP.spE = false;
  render();
  if (!$('s-cust').hidden) renderPreview(dt);
  requestAnimationFrame(frame);
}
async function boot() {
  applyQuality(); resize(); wire();
  try {
    await Promise.race([
      Promise.all(['24px Lalezar', '24px Bungee', '16px Vazirmatn', 'bold 16px Vazirmatn'].map(f => document.fonts.load(f))),
      new Promise(r => setTimeout(r, 3500))
    ]);
  } catch (e) { }
  G.stage = 0; G.art = buildStage(0);
  $('loading').hidden = true;
  toMenu();
  requestAnimationFrame(t => { last = t; frame(t); });
}
boot();
</script>
